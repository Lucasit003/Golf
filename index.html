<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Setji's Swing — swing survey</title>
    <meta
      name="description"
      content="Film a golf swing, get it surveyed. Measured against tour benchmarks and drawn back over your own footage — all on your device."
    />

    <!-- Icons & install -->
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#143a24" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e7e9e0" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Setji's Swing" />

    <!-- Social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Setji's Swing — swing survey" />
    <meta
      property="og:description"
      content="Film a golf swing, get it surveyed. Measured against tour benchmarks, drawn back over your own footage. Runs on your device."
    />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Setji's Swing — swing survey" />
    <meta
      name="twitter:description"
      content="Film a golf swing, get it surveyed — measured against tour benchmarks, on your device."
    />
    <meta name="twitter:image" content="/icon-512.png" />

    <!-- Fonts are self-hosted (see src/styles/fonts.css) — no third-party request.
         Preload the display + body faces so first paint has them ready. -->
    <link rel="preload" href="/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/public-sans.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Splash styles + no-flash theme. Both run before first paint so neither
         the splash nor the app flashes the wrong theme. -->
    <style>
      .app-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #e7e9e0;
        color: #14211b;
        font-family: 'Archivo', system-ui, sans-serif;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        font-size: 1.25rem;
      }
      .app-splash span {
        opacity: 0.55;
      }
      @media (prefers-color-scheme: dark) {
        .app-splash {
          background: #141d18;
          color: #e7e9e0;
        }
      }
      :root[data-theme='dark'] .app-splash {
        background: #141d18;
        color: #e7e9e0;
      }
      :root[data-theme='light'] .app-splash {
        background: #e7e9e0;
        color: #14211b;
      }
    </style>
    <script>
      // Apply a forced light/dark theme before render so there's no theme flash.
      // 'system' leaves the attribute off and lets the media query decide.
      try {
        var p = JSON.parse(localStorage.getItem('setjis.prefs') || '{}')
        if (p.theme === 'dark' || p.theme === 'light') {
          document.documentElement.setAttribute('data-theme', p.theme)
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Pre-hydration splash: paints instantly so slow connections never flash
           a blank screen. React replaces it on mount. -->
      <div class="app-splash"><span>Setji's Swing</span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
